<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6ef"><title>Plify</title><meta name="description" content="YouTube 링크를 MP3로, 플레이리스트를 ZIP으로. 광고 없이 간편하게."><link rel="stylesheet" href="/style.css"><script defer src="/app.js?v=public-2"></script></head>
<body><div class="site-shell"><header class="site-header"><a class="brand" href="/" aria-label="Plify 홈"><span class="brand-mark">p<span>•</span></span><span>plify</span></a><button class="code-trigger" id="code-button" type="button">다운로드 코드 <span aria-hidden="true">↗</span></button></header>
<main><section class="hero" aria-labelledby="hero-title"><div class="hero-copy"><h1 id="hero-title">음악을 내 기기에.</h1><p>YouTube 링크를 붙여넣으세요.</p><form id="download-form" class="url-form"><label class="sr-only" for="download-url">YouTube 영상 또는 플레이리스트 링크</label><span class="link-icon" aria-hidden="true">↗</span><input id="download-url" type="url" inputmode="url" placeholder="YouTube 영상 또는 플레이리스트 링크" required autocomplete="off"><button id="download-submit" type="submit" disabled>다운로드 <span aria-hidden="true">↓</span></button></form><p class="quota-line" id="quota-info" aria-live="polite">연결 중</p></div><div class="record-art" aria-hidden="true"><div class="record"><div class="record-label">plify<span>♪</span></div></div></div></section>
<p class="notice" id="notice" role="status" hidden></p><section class="requests" id="requests-section" hidden aria-labelledby="requests-title"><div class="section-heading"><h2 id="requests-title">다운로드</h2></div><div id="download-list"></div></section></main>
<footer><a href="https://selyth.xyz" target="_blank" rel="noopener noreferrer">© <span id="copyright-year">2026</span> Selyth</a><a id="local-admin-link" href="/admin" hidden>관리</a></footer></div>
<dialog id="code-dialog"><form id="code-form"><div class="dialog-heading"><h2>다운로드 코드</h2><button type="button" id="code-close" class="icon-button" aria-label="닫기">×</button></div><p id="code-description">코드가 있으면 횟수 제한 없이 사용할 수 있어요.</p><label for="download-code">코드</label><input id="download-code" type="password" autocomplete="off" maxlength="128" placeholder="다운로드 코드 입력"><p class="form-error" id="code-error" role="status"></p><div class="dialog-actions"><button id="code-logout" type="button" class="secondary" hidden>인증 해제</button><button class="primary" id="code-submit" type="submit">인증</button></div></form></dialog>
<div class="toast" id="toast" role="status" hidden></div></body></html>
